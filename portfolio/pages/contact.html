<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact - Persoonlijke portfolio website">
    <title>Contact - Mijn Portfolio</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="../index.html" class="logo">Mijn<span>Portfolio</span></a>
                <button class="hamburger" aria-label="Menu openen">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="over-mij.html">Over mij</a></li>
                    <li><a href="projecten.html">Projecten</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-banner">
            <div class="container">
                <h1>Neem contact op</h1>
                <p>Ik reageer zo snel mogelijk</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="contact-grid">
                    <div>
                        <h2 class="section-title" style="text-align:left;">Contactgegevens</h2>
                        <div class="contact-item">
                            <div class="contact-icon">&#9993;</div>
                            <div>
                                <h4>E-mail</h4>
                                <p>jouwnaam@voorbeeld.nl</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="contact-icon">&#9742;</div>
                            <div>
                                <h4>Telefoon</h4>
                                <p>+31 6 12345678</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="contact-icon">&#9998;</div>
                            <div>
                                <h4>Locatie</h4>
                                <p>Nederland</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="section-title" style="text-align:left;">Stuur een bericht</h2>
                        <div class="alert" id="form-alert"></div>
                        <form id="contact-form">
                            <div class="form-group">
                                <label for="naam">Naam</label>
                                <input type="text" id="naam" name="naam" placeholder="Jouw naam" required>
                            </div>
                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" name="email" placeholder="jouw@email.nl" required>
                            </div>
                            <div class="form-group">
                                <label for="bericht">Bericht</label>
                                <textarea id="bericht" name="bericht" placeholder="Jouw bericht..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-dark">Verstuur bericht</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year">2026</span> Mijn Portfolio. Alle rechten voorbehouden.</p>
        </div>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
